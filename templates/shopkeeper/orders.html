<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — Shopkeeper Panel</title>
  <link rel="stylesheet" href="/static/css/shared.css?v={{ ASSET_V }}">
  <link rel="stylesheet" href="/static/css/admin.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    .filter-bar { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
    .filter-bar select { padding:8px 12px; border:2px solid var(--border); border-radius:8px; font-size:0.9rem; }
    .order-thumb { width:38px; height:38px; border-radius:6px; object-fit:cover; border:1px solid var(--border); flex-shrink:0; }
    .order-thumb-placeholder { width:38px; height:38px; border-radius:6px; border:1px dashed var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:0.9rem; color:var(--muted); background:#FAFAFA; }
    .btn-spinner { display: inline-block; width: 11px; height: 11px; border: 2px solid rgba(255,255,255,0.35); border-top-color: #FFFFFF; border-radius: 50%; margin-right: 6px; vertical-align: -1px; animation: btn-spin 0.7s linear infinite; }
    .btn-outline .btn-spinner { border-color: rgba(10,10,10,0.25); border-top-color: #0A0A0A; }
    @keyframes btn-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="admin-layout">
  {% set active = 'orders' %}
  {% include 'shopkeeper/_sidebar.html' %}

  <div class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <span class="admin-topbar-title">My Orders</span>
      </div>
    </div>

    <div class="admin-content">
      <div class="filter-bar">
        <select id="filter-status" onchange="loadOrders()">
          <option value="">All Statuses</option>
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="shipped">Shipped</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Product</th><th>Size / Color</th><th>You Get</th><th>Payment</th><th>Status</th><th>Date</th><th>Actions</th></tr>
          </thead>
          <tbody id="orders-body">
            <tr><td colspan="7" style="text-align:center;padding:32px;color:var(--muted)">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Order Detail Modal -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal" style="max-width:460px">
    <div class="modal-header">
      <h3 class="modal-title">Order Details</h3>
      <button class="modal-close" onclick="closeDetailModal()">×</button>
    </div>
    <div id="detail-body">Loading...</div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/static/js/shared.js?v={{ ASSET_V }}"></script>
<script>
async function loadOrders() {
  const status = document.getElementById('filter-status').value;
  try {
    const orders = await apiFetch(`/api/orders/shopkeeper/mine${status ? '?status=' + status : ''}`);
    const body = document.getElementById('orders-body');
    if (!orders.length) {
      body.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--muted)">No orders yet.</td></tr>';
      return;
    }
    body.innerHTML = orders.map(o => `
      <tr>
        <td style="display:flex;align-items:center;gap:8px">
          ${o.product_image ? `<img class="order-thumb" src="${escapeHtml(o.product_image)}">` : '<div class="order-thumb-placeholder">—</div>'}
          <strong>${escapeHtml(o.product_name)}</strong>
        </td>
        <td>${escapeHtml(o.size)} / ${escapeHtml(o.color)}</td>
        <td><strong>₹${Number(o.shopkeeper_price).toLocaleString('en-IN')}</strong></td>
        <td>${(o.payment_type || '—').toUpperCase()} · <span class="badge badge-${o.payment_status === 'received' || o.payment_status === 'verified' ? 'success' : 'muted'}">${o.payment_status}</span></td>
        <td><span class="badge badge-gold">${o.status}</span></td>
        <td>${new Date(o.created_at).toLocaleDateString('en-IN')}</td>
        <td style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn btn-outline btn-sm" onclick="viewOrderDetail('${o.id}')">View Details</button>
          <button class="btn btn-outline btn-sm" onclick="downloadOrderPDF('${o.id}', this)">Generate PDF</button>
          ${o.package_pdf_status === 'ready' ? `<button class="btn btn-outline btn-sm" onclick="downloadPackagePDF('${o.id}', this)">📦 Package PDF</button>` : ''}
        </td>
      </tr>
    `).join('');
  } catch(e) {
    showToast(e.message || 'Failed to load orders', 'error');
  }
}

// Loads an image URL into a base64 data URL via an off-DOM <img> + canvas.
// Resolves to null (never rejects) on any failure.
function loadImageAsDataURL(url, timeoutMs = 8000) {
  return new Promise((resolve) => {
    if (!url) return resolve(null);
    const img = new Image();
    img.crossOrigin = "anonymous";
    let settled = false;
    const finish = (val) => { if (!settled) { settled = true; clearTimeout(timer); resolve(val); } };
    const timer = setTimeout(() => finish(null), timeoutMs);
    img.onload = () => {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth || 400;
        canvas.height = img.naturalHeight || 400;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        finish(canvas.toDataURL("image/jpeg", 0.9));
      } catch (e) { finish(null); }
    };
    img.onerror = () => finish(null);
    img.src = url;
  });
}

// Downloads the pre-built package PDF (product photo + NimbusPost's real
// barcode label) generated automatically after shipment — different from
// "Generate PDF" above, which renders a slip client-side on demand.
async function downloadPackagePDF(orderId, btnEl) {
  const originalHTML = btnEl.innerHTML;
  btnEl.disabled = true;
  btnEl.innerHTML = '<span class="btn-spinner"></span>Downloading...';
  try {
    const data = await apiFetch(`/api/orders/shopkeeper/${orderId}/package-pdf`);
    const byteChars = atob(data.content_base64);
    const bytes = new Uint8Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) bytes[i] = byteChars.charCodeAt(i);
    const blob = new Blob([bytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = data.filename || `order_${orderId.slice(0, 8)}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    showToast(e.message || "Failed to download package PDF", "error");
  } finally {
    btnEl.disabled = false;
    btnEl.innerHTML = originalHTML;
  }
}

async function downloadOrderPDF(orderId, btnEl) {
  const originalHTML = btnEl.innerHTML;
  btnEl.disabled = true;
  btnEl.innerHTML = '<span class="btn-spinner"></span>Generating...';
  try {
    const data = await apiFetch(`/api/orders/shopkeeper/${orderId}/pdf-data`);
    await buildOrderPDF(data);
  } catch (e) {
    showToast(e.message || "Failed to generate PDF", "error");
  } finally {
    btnEl.disabled = false;
    btnEl.innerHTML = originalHTML;
  }
}

// Same layout/format as the admin packing-slip PDF, minus customer contact
// details and our_price/profit — a shopkeeper only ever sees what they're
// paid (shopkeeper_price) and what they need to pack correctly.
async function buildOrderPDF(data) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const pageW = 210, pageH = 297, margin = 16;
  const BLACK = [10, 10, 10], GRAY = [107, 107, 107], LIGHT = [232, 232, 232];
  let y = margin;

  function checkPageBreak(needed) { if (y + needed > pageH - margin) { doc.addPage(); y = margin; } }
  function divider() { doc.setDrawColor(...LIGHT); doc.setLineWidth(0.3); doc.line(margin, y, pageW - margin, y); y += 8; }
  function sectionHeading(title) {
    checkPageBreak(14);
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...BLACK);
    doc.text(title.toUpperCase(), margin, y); y += 3;
    doc.setDrawColor(...BLACK); doc.setLineWidth(0.6); doc.line(margin, y, margin + 26, y); y += 8;
  }
  const rupee = (n) => `Rs. ${Number(n || 0).toLocaleString("en-IN")}`;

  // ── HEADER ──
  doc.setFont("helvetica", "bold"); doc.setFontSize(20); doc.setTextColor(...BLACK);
  doc.text("clovical", margin, y + 4);
  const orderIdShort = "#" + (data.order.id || "").slice(0, 8).toUpperCase();
  doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...GRAY);
  doc.text(orderIdShort, pageW - margin, y + 2, { align: "right" });
  y += 11;
  const orderDate = data.order.created_at
    ? new Date(data.order.created_at).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" }) : "—";
  doc.setFontSize(9); doc.setTextColor(...GRAY);
  doc.text(`Order Date: ${orderDate}`, margin, y);
  const status = (data.order.status || "—").toUpperCase();
  doc.setFont("helvetica", "bold"); doc.setFontSize(8.5);
  const badgeW = doc.getTextWidth(status) + 8;
  doc.setFillColor(...BLACK);
  doc.roundedRect(pageW - margin - badgeW, y - 4.5, badgeW, 6.5, 1.5, 1.5, "F");
  doc.setTextColor(255, 255, 255);
  doc.text(status, pageW - margin - badgeW / 2, y, { align: "center" });
  y += 8; divider();

  // ── PRODUCT ──
  sectionHeading("Product Details");
  const imgSize = 28;
  let imgData = null;
  try { imgData = await loadImageAsDataURL(data.product.image); } catch (e) {}
  const textX = margin + (imgData ? imgSize + 8 : 0);
  const textW = pageW - margin * 2 - (imgData ? imgSize + 8 : 0);
  const imgTop = y;
  if (imgData) {
    try {
      doc.setDrawColor(...LIGHT); doc.rect(margin, y, imgSize, imgSize);
      doc.addImage(imgData, "JPEG", margin, y, imgSize, imgSize);
    } catch (e) {}
  }
  let py = y;
  doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(...BLACK);
  const nameLines = doc.splitTextToSize(data.product.name || "—", textW);
  doc.text(nameLines, textX, py + 4);
  py += 4 + nameLines.length * 5 + 2;
  doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...GRAY);
  doc.text(`Size: ${data.product.size || "—"}    Color: ${data.product.color || "—"}`, textX, py); py += 5;
  doc.text(`Shopkeeper Code: ${data.product.shopkeeper_code || "—"}`, textX, py); py += 5;
  doc.setFont("helvetica", "bold"); doc.setTextColor(...BLACK);
  doc.text(`You Get: ${rupee(data.product.shopkeeper_price)}`, textX, py); py += 5;
  y = Math.max(imgTop + imgSize, py) + 6; divider();

  // ── PAYMENT ──
  sectionHeading("Payment Details");
  doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(...GRAY);
  doc.text(`Payment Type: ${(data.payment.type || "—").toUpperCase()}`, margin, y); y += 6;
  doc.text(`Payment Status: ${(data.payment.status || "—").toUpperCase()}`, margin, y); y += 8;
  divider();

  // ── SHIPPING (if available) ──
  const s = data.shipping;
  if (s.courier_name || s.tracking_id) {
    sectionHeading("Shipping Details");
    doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(...GRAY);
    if (s.courier_name) { doc.text(`Courier: ${s.courier_name}`, margin, y); y += 6; }
    if (s.tracking_id) { doc.text(`Tracking ID: ${s.tracking_id}`, margin, y); y += 6; }
    y += 2; divider();
  }

  // ── PACKING CHECKLIST ──
  checkPageBreak(85);
  doc.setFillColor(...BLACK); doc.rect(margin, y, pageW - margin * 2, 9, "F");
  doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(255, 255, 255);
  doc.text("PACKING CHECKLIST", margin + 4, y + 6.2);
  y += 16;
  const checklist = [
    "Correct product picked",
    `Correct size: ${data.product.size || "—"}`,
    `Correct color: ${data.product.color || "—"}`,
    "Product packed in Clovical polybag",
    "Ready for pickup",
  ];
  doc.setFont("helvetica", "normal"); doc.setFontSize(12); doc.setTextColor(...BLACK);
  checklist.forEach((item) => {
    checkPageBreak(11);
    doc.setDrawColor(...BLACK); doc.setLineWidth(0.5);
    doc.rect(margin, y - 4.2, 5.5, 5.5);
    doc.text(item, margin + 9, y);
    y += 11;
  });

  const filename = `Order-${(data.order.id || "").slice(0, 8)}.pdf`;
  doc.save(filename);
}

// Read-only order detail modal — reuses the same PII-free pdf-data endpoint
// already used for PDF generation. Shopkeepers get visibility only, no
// delete/cancel power (that stays admin-only).
async function viewOrderDetail(orderId) {
  const modal = document.getElementById('detail-modal');
  const body = document.getElementById('detail-body');
  body.innerHTML = 'Loading...';
  modal.classList.add('open');
  try {
    const data = await apiFetch(`/api/orders/shopkeeper/${orderId}/pdf-data`);
    body.innerHTML = `
      <div style="display:flex;gap:14px;align-items:center;margin-bottom:16px">
        ${data.product.image ? `<img src="${data.product.image}" style="width:60px;height:60px;border-radius:8px;object-fit:cover;border:1px solid var(--border)">` : ''}
        <div>
          <div style="font-weight:600">${data.product.name || '—'}</div>
          <div style="font-size:0.82rem;color:var(--muted)">Size: ${data.product.size || '—'} · Color: ${data.product.color || '—'}</div>
          <div style="font-weight:700;margin-top:4px">You Get: ₹${Number(data.product.shopkeeper_price || 0).toLocaleString('en-IN')}</div>
        </div>
      </div>
      <div style="font-size:0.85rem;line-height:1.9">
        <div><strong>Status:</strong> <span class="badge badge-gold">${data.order.status || '—'}</span></div>
        <div><strong>Payment:</strong> ${(data.payment.type || '—').toUpperCase()} · ${data.payment.status || '—'}</div>
        <div><strong>Order Date:</strong> ${data.order.created_at ? new Date(data.order.created_at).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }) : '—'}</div>
        ${data.shipping.tracking_id ? `<div><strong>Tracking:</strong> ${data.shipping.courier_name ? data.shipping.courier_name + ' · ' : ''}${data.shipping.tracking_id}</div>` : ''}
      </div>
    `;
  } catch (e) {
    body.innerHTML = `<div class="alert alert-danger">${e.message || "Couldn't load this order."}</div>`;
  }
}

function closeDetailModal() { document.getElementById('detail-modal').classList.remove('open'); }

async function skLogout() {
  await apiFetch('/api/shopkeeper-auth/logout', { method: 'POST' });
  window.location = '/shopkeeper/login';
}

loadOrders();
</script>
</body>
</html>
