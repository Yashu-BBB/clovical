<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics — Shopkeeper Panel</title>
  <link rel="stylesheet" href="/static/css/shared.css?v={{ ASSET_V }}">
  <link rel="stylesheet" href="/static/css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    .section-head { font-size:1.1rem; font-weight:800; margin:28px 0 14px; padding-bottom:8px; border-bottom:2px solid var(--border); display:flex; align-items:center; gap:8px; }
    .section-head:first-child { margin-top:0; }
    .chart-card { background:#fff; border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:20px; }
    .chart-card h3 { font-size:0.9rem; font-weight:700; margin-bottom:14px; color:var(--text); }
    .chart-card canvas { max-height:260px; }

    .stat-note { font-size:0.68rem; color:var(--muted); font-weight:500; text-transform:none; letter-spacing:normal; margin-top:4px; line-height:1.35; }

    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
    @media (max-width:760px) { .two-col { grid-template-columns:1fr; } }

    .panel { background:#fff; border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; }
    .panel h3 { font-size:0.9rem; font-weight:700; margin-bottom:14px; }

    .rank-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid #F2F2F2; font-size:0.86rem; }
    .rank-row:last-child { border-bottom:none; }
    .rank-name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .rank-value { font-weight:800; color:var(--text); flex-shrink:0; }

    .chip-list { display:flex; flex-wrap:wrap; gap:8px; }
    .chip { background:#FAFAFA; border:1.5px solid var(--border); border-radius:999px; padding:6px 12px; font-size:0.8rem; font-weight:600; }
    .chip b { font-weight:800; }

    .stock-item { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #F2F2F2; }
    .stock-item:last-child { border-bottom:none; }
    .stock-item img, .stock-item .thumb-placeholder { width:38px; height:48px; object-fit:cover; border-radius:6px; border:1px solid var(--border); flex-shrink:0; }
    .stock-item .thumb-placeholder { display:flex; align-items:center; justify-content:center; font-size:0.65rem; color:var(--muted); background:#FAFAFA; }
    .stock-item-name { font-weight:600; font-size:0.86rem; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    .empty-note { text-align:center; padding:20px; color:var(--muted); font-size:0.85rem; }
  </style>
</head>
<body>
<div class="admin-layout">
  {% set active = 'analytics' %}
  {% include 'shopkeeper/_sidebar.html' %}

  <div class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <span class="admin-topbar-title">Analytics</span>
      </div>
      <button class="btn btn-outline btn-sm" onclick="loadAnalytics()">🔄 Refresh</button>
    </div>

    <div class="admin-content">
      <div id="loading" style="text-align:center;padding:48px;color:var(--muted)">
        <div style="font-size:2rem;margin-bottom:8px">📊</div>
        Loading your analytics...
      </div>

      <div id="analytics-content" style="display:none">

        <!-- 1. EARNINGS -->
        <div class="section-head">💰 Earnings</div>
        <div class="stat-grid" id="earnings-stats"></div>
        <div class="chart-card">
          <h3>Earnings — Last 30 Days</h3>
          <canvas id="earningsTrendChart"></canvas>
        </div>

        <!-- 2. SALES PERFORMANCE -->
        <div class="section-head">📈 Sales Performance</div>
        <div class="stat-grid" id="sales-stats"></div>
        <div class="two-col">
          <div class="panel">
            <h3>Units Sold Per Product</h3>
            <div id="units-by-product"></div>
          </div>
          <div class="panel">
            <h3>Best-Selling Sizes &amp; Colors</h3>
            <div style="margin-bottom:12px">
              <div class="stat-label" style="margin-bottom:8px">Sizes</div>
              <div class="chip-list" id="best-sizes"></div>
            </div>
            <div>
              <div class="stat-label" style="margin-bottom:8px">Colors</div>
              <div class="chip-list" id="best-colors"></div>
            </div>
          </div>
        </div>

        <!-- 3. STOCK HEALTH -->
        <div class="section-head">📦 Stock Health</div>
        <div class="stat-grid" id="stock-stats"></div>
        <div class="two-col">
          <div class="panel">
            <h3>⚠️ Low Stock</h3>
            <div id="low-stock-list"></div>
          </div>
          <div class="panel">
            <h3>🚫 Out of Stock</h3>
            <div id="out-stock-list"></div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/static/js/shared.js?v={{ ASSET_V }}"></script>
<script>
const PRIMARY = '#1a1a1a';
let earningsChart = null;

function pctBadge(pct) {
  if (pct > 0) return `<span style="color:var(--success)">▲ ${pct}%</span>`;
  if (pct < 0) return `<span style="color:var(--danger)">▼ ${Math.abs(pct)}%</span>`;
  return `<span style="color:var(--muted)">– 0%</span>`;
}

function renderStockRow(p) {
  const thumb = p.image ? `<img src="${p.image}">` : '<div class="thumb-placeholder">—</div>';
  return `
    <div class="stock-item">
      ${thumb}
      <div class="stock-item-name">${p.name}</div>
      <span class="badge ${p.stock === 0 ? 'badge-danger' : 'badge-gold'}">${p.stock} left</span>
    </div>`;
}

async function loadAnalytics() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('analytics-content').style.display = 'none';
  try {
    const d = await apiFetch('/api/shopkeeper/analytics');

    // ── Earnings ──────────────────────────────────────────────
    document.getElementById('earnings-stats').innerHTML = `
      <div class="stat-card green">
        <div class="stat-label">Total Earned</div>
        <div class="stat-value">${formatPrice(d.earnings.total_earned)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">This Month</div>
        <div class="stat-value">${formatPrice(d.earnings.this_month_earned)}</div>
      </div>`;

    if (earningsChart) earningsChart.destroy();
    const trend = d.earnings.trend_30d || [];
    earningsChart = new Chart(document.getElementById('earningsTrendChart'), {
      type: 'bar',
      data: {
        labels: trend.map(t => t.date.slice(5)),
        datasets: [{ data: trend.map(t => t.earned), backgroundColor: PRIMARY, borderRadius: 4 }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, ticks: { callback: v => '₹' + v.toLocaleString('en-IN') } } }
      }
    });

    // ── Sales performance ────────────────────────────────────
    const wk = d.sales.orders_this_week, mo = d.sales.orders_this_month;
    document.getElementById('sales-stats').innerHTML = `
      <div class="stat-card">
        <div class="stat-label">Orders This Week</div>
        <div class="stat-value">${wk.count}</div>
        <div class="stat-note">${pctBadge(wk.change_pct)} vs last week (${wk.prev_count})</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Orders This Month</div>
        <div class="stat-value">${mo.count}</div>
        <div class="stat-note">${pctBadge(mo.change_pct)} vs last month (${mo.prev_count})</div>
      </div>`;

    const unitsWrap = document.getElementById('units-by-product');
    unitsWrap.innerHTML = d.sales.units_by_product.length
      ? d.sales.units_by_product.map(p => `
          <div class="rank-row">
            <span class="rank-name">${p.product_name}</span>
            <span class="rank-value">${p.units} sold</span>
          </div>`).join('')
      : '<div class="empty-note">No sales yet.</div>';

    const sizesWrap = document.getElementById('best-sizes');
    sizesWrap.innerHTML = d.sales.best_sizes.length
      ? d.sales.best_sizes.map(s => `<div class="chip">${s.size} — <b>${s.count}</b> sold</div>`).join('')
      : '<div class="empty-note">No size data yet.</div>';

    const colorsWrap = document.getElementById('best-colors');
    colorsWrap.innerHTML = d.sales.best_colors.length
      ? d.sales.best_colors.map(c => `<div class="chip">${c.color} — <b>${c.count}</b> sold</div>`).join('')
      : '<div class="empty-note">No color data yet.</div>';

    // ── Stock health ──────────────────────────────────────────
    document.getElementById('stock-stats').innerHTML = `
      <div class="stat-card amber">
        <div class="stat-label">Low Stock Items</div>
        <div class="stat-value">${d.stock.low_stock.length}</div>
      </div>
      <div class="stat-card red">
        <div class="stat-label">Out of Stock</div>
        <div class="stat-value">${d.stock.out_of_stock.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Requests Awaiting Review</div>
        <div class="stat-value">${d.stock.pending_requests_count}</div>
      </div>`;

    document.getElementById('low-stock-list').innerHTML = d.stock.low_stock.length
      ? d.stock.low_stock.map(renderStockRow).join('')
      : '<div class="empty-note">Nothing running low right now 🎉</div>';

    document.getElementById('out-stock-list').innerHTML = d.stock.out_of_stock.length
      ? d.stock.out_of_stock.map(renderStockRow).join('')
      : '<div class="empty-note">Nothing out of stock right now 🎉</div>';

    document.getElementById('loading').style.display = 'none';
    document.getElementById('analytics-content').style.display = 'block';
  } catch (e) {
    document.getElementById('loading').innerHTML = `<div style="color:var(--danger)">${e.message || 'Failed to load analytics'}</div>`;
  }
}

async function skLogout() {
  await apiFetch('/api/shopkeeper-auth/logout', { method: 'POST' });
  window.location = '/shopkeeper/login';
}

loadAnalytics();
</script>
</body>
</html>
