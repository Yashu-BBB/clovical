<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders — clovical Admin</title>
  <link rel="stylesheet" href="/static/css/shared.css">
  <link rel="stylesheet" href="/static/css/admin.css">
  <style>
    .filter-bar { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
    .filter-bar select, .filter-bar input { padding:8px 12px; border:2px solid var(--border); border-radius:8px; font-size:0.9rem; }
    .ship-actions { display:flex; flex-direction:column; gap:4px; }
    .ship-actions .btn { white-space:nowrap; }
    .order-code-cell { display:flex; align-items:center; gap:8px; }
    .order-thumb { width:38px; height:38px; border-radius:6px; object-fit:cover; border:1px solid var(--border); flex-shrink:0; }
    .order-thumb-placeholder { width:38px; height:38px; border-radius:6px; border:1px dashed var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:0.9rem; color:var(--muted); background:#FAFAFA; }
    .pincode-tag { font-family:monospace; font-weight:700; letter-spacing:0.03em; }
    .btn-spinner {
      display: inline-block;
      width: 11px;
      height: 11px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: -1px;
      animation: btn-spin 0.7s linear infinite;
    }
    .btn-outline .btn-spinner { border-color: rgba(10,10,10,0.25); border-top-color: #0A0A0A; }
    @keyframes btn-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="admin-layout">
  {% set active = 'orders' %}
  {% include 'admin/_sidebar.html' %}

  <div class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <span class="admin-topbar-title">Orders</span>
      </div>
    </div>

    <div class="admin-content">
      <div class="filter-bar">
        <select id="filter-status" onchange="loadOrders()">
          <option value="">All Statuses</option>
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="shipped">Shipped</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
          <option value="refunded">Refunded</option>
        </select>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Order</th><th>Customer</th><th>Product</th>
              <th>Amount</th><th>Profit</th><th>Payment</th>
              <th>Status</th><th>Shipping</th><th>Date</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="orders-body">
            <tr><td colspan="10" style="text-align:center;padding:32px;color:var(--muted)">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Update Status Modal -->
<div class="modal-overlay" id="status-modal">
  <div class="modal" style="max-width:480px">
    <div class="modal-header">
      <h3 class="modal-title">Update Order</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div id="modal-alert"></div>
    <div style="margin-bottom:12px;padding:12px;background:#F3F0FF;border-radius:8px;font-size:0.9rem" id="order-info"></div>

    <div class="form-group">
      <label class="form-label">Order Status</label>
      <select class="form-control" id="new-status">
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="shipped">Shipped</option>
        <option value="delivered">Delivered</option>
        <option value="cancelled">Cancelled</option>
        <option value="refunded">Refunded</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Payment Status</label>
      <select class="form-control" id="new-payment-status">
        <option value="">— no change —</option>
        <option value="pending">Pending</option>
        <option value="received">Received</option>
        <option value="verified">Verified</option>
        <option value="failed">Failed</option>
      </select>
    </div>

    <div id="shipping-fields" style="display:none">
      <div class="form-group">
        <label class="form-label">Tracking ID</label>
        <input class="form-control" id="tracking-id" placeholder="e.g. DLVY1234567890">
      </div>
      <div class="form-group">
        <label class="form-label">Courier Name</label>
        <input class="form-control" id="courier-name" placeholder="e.g. Delhivery, Shiprocket, Blue Dart">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Refund Status</label>
      <select class="form-control" id="refund-status">
        <option value="">— no change —</option>
        <option value="none">None</option>
        <option value="pending">Pending</option>
        <option value="processed">Processed</option>
      </select>
    </div>

    <div style="display:flex;gap:12px;margin-top:8px">
      <button class="btn btn-primary btn-lg" style="flex:1" onclick="saveStatus()">Update Order</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- Tracking Popup -->
<div class="modal-overlay" id="track-modal">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <h3 class="modal-title">Live Tracking</h3>
      <button class="modal-close" onclick="document.getElementById('track-modal').classList.remove('open')">×</button>
    </div>
    <div id="track-content" style="padding:8px 0">Loading...</div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/static/js/shared.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// Rendered server-side (routers/public.py) from the same env-var check the
// backend /ship endpoint uses — no extra fetch needed to know this up front.
const NIMBUSPOST_CONFIGURED = {{ 'true' if nimbuspost_configured else 'false' }};
const STATUS_COLORS = { pending:'warning', confirmed:'primary', shipped:'primary', delivered:'success', cancelled:'danger', refunded:'muted' };
let currentOrderId = null;

async function loadOrders() {
  const status = document.getElementById("filter-status").value;
  const url = `/api/orders/admin/all${status ? `?status=${status}` : ''}`;
  try {
    const orders = await apiFetch(url);
    const body = document.getElementById("orders-body");
    if (!orders.length) {
      body.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:32px;color:var(--muted)">No orders found</td></tr>';
      return;
    }
    body.innerHTML = orders.map(o => `
      <tr>
        <td style="font-family:monospace;font-size:0.75rem">
          <div class="order-code-cell">
            ${o.product_image
              ? `<img class="order-thumb" src="${o.product_image}" alt="${o.product_name || ''}">`
              : `<span class="order-thumb-placeholder">📦</span>`}
            <span>${o.id.slice(0,8)}...<br><span style="color:var(--muted)">${o.shopkeeper_code||''}</span></span>
          </div>
        </td>
        <td>
          <strong>${o.customer_name}</strong><br>
          <a href="https://wa.me/91${o.customer_phone}" target="_blank" style="color:var(--primary);font-size:0.8rem">${o.customer_phone}</a><br>
          <span style="color:var(--muted);font-size:0.75rem">${o.customer_city} — <span class="pincode-tag">${o.customer_pincode || '—'}</span></span>
        </td>
        <td>
          <strong>${o.product_name}</strong><br>
          <span style="color:var(--muted);font-size:0.8rem">Size: ${o.size} · ${o.color}</span>
          ${o.tracking_id ? `<br><span style="font-size:0.75rem">📦 ${o.tracking_id}</span>` : ''}
          ${o.courier_name ? `<br><span style="font-size:0.7rem;color:var(--muted)">${o.courier_name}</span>` : ''}
        </td>
        <td><strong>${formatPrice(o.our_price)}</strong></td>
        <td style="color:var(--success);font-weight:700">+${formatPrice(o.profit)}</td>
        <td>
          <span class="badge badge-${o.payment_type === 'upi' ? 'primary' : 'warning'}">${(o.payment_type||'').toUpperCase()}</span><br>
          <span style="font-size:0.75rem;color:var(--muted)">${o.payment_status||''}</span>
        </td>
        <td><span class="badge badge-${STATUS_COLORS[o.status]||'muted'}">${o.status}</span>
          ${o.refund_status && o.refund_status !== 'none' ? `<br><span class="badge badge-warning" style="margin-top:4px">${o.refund_status}</span>` : ''}
        </td>
        <td style="font-size:0.75rem">
          ${o.nimbuspost_awb
            ? `<span class="badge badge-success">${o.shipping_status || 'created'}</span>`
            : (o.status === 'confirmed' ? '<span class="badge badge-warning">Not shipped</span>' : '<span style="color:var(--muted)">—</span>')}
        </td>
        <td style="font-size:0.8rem;color:var(--muted)">${new Date(o.created_at).toLocaleDateString('en-IN')}</td>
        <td>
          <div class="ship-actions">
            <button class="btn btn-outline btn-sm" onclick='openUpdate(${JSON.stringify(o)})'>Update</button>
            <button class="btn btn-outline btn-sm" onclick="downloadOrderPDF('${o.id}', this)">📄 PDF</button>
            ${o.package_pdf_status === 'ready' ? `<button class="btn btn-outline btn-sm" onclick="downloadPackagePDF('${o.id}', this)">📦 Package PDF</button>` : ''}
            ${!o.nimbuspost_awb
              ? (NIMBUSPOST_CONFIGURED
                  ? `<button class="btn btn-primary btn-sm" onclick="createShipment('${o.id}')">Create Shipment</button>`
                  : `<button class="btn btn-outline btn-sm" disabled title="NimbusPost not configured yet">Create Shipment</button>`)
              : ''}
            ${o.nimbuspost_awb && !o.label_url ? `<button class="btn btn-outline btn-sm" disabled title="Label not available">Print Label</button>` : ''}
            ${o.label_url ? `<button class="btn btn-outline btn-sm" onclick="printLabel('${o.id}')">Print Label</button>` : ''}
            ${o.nimbuspost_awb ? `<button class="btn btn-outline btn-sm" onclick="trackShipment('${o.id}')">Track</button>` : ''}
            ${o.nimbuspost_awb ? `<button class="btn btn-danger btn-sm" onclick="cancelShipment('${o.id}')">Cancel Shipment</button>` : ''}
            <button class="btn btn-danger btn-sm" onclick="deleteOrder('${o.id}')">Delete</button>
          </div>
        </td>
      </tr>
    `).join("");
  } catch(e) {
    showToast("Failed to load orders", "error");
  }
}

function openUpdate(order) {
  currentOrderId = order.id;
  document.getElementById("new-status").value = order.status;
  document.getElementById("new-payment-status").value = "";
  document.getElementById("tracking-id").value = order.tracking_id || "";
  document.getElementById("courier-name").value = order.courier_name || "";
  document.getElementById("refund-status").value = "";
  document.getElementById("modal-alert").innerHTML = "";
  document.getElementById("order-info").innerHTML = `
    <div style="display:flex;gap:10px;align-items:flex-start">
      ${order.product_image ? `<img src="${order.product_image}" alt="${order.product_name || ''}" style="width:52px;height:52px;border-radius:8px;object-fit:cover;border:1px solid var(--border);flex-shrink:0">` : ''}
      <div>
        <strong>${order.customer_name}</strong> — ${order.product_name}<br>
        Size: ${order.size} · Color: ${order.color} · Amount: <strong>${formatPrice(order.our_price)}</strong><br>
        <span style="color:var(--muted)">Ship to pincode: <span class="pincode-tag">${order.customer_pincode || '—'}</span></span>
      </div>
    </div>
  `;
  toggleShippingFields();
  document.getElementById("status-modal").classList.add("open");
}

function closeModal() { document.getElementById("status-modal").classList.remove("open"); }

document.getElementById("new-status").addEventListener("change", toggleShippingFields);
function toggleShippingFields() {
  const status = document.getElementById("new-status").value;
  document.getElementById("shipping-fields").style.display = status === "shipped" ? "block" : "none";
}

async function saveStatus() {
  const payload = {
    status: document.getElementById("new-status").value,
    payment_status: document.getElementById("new-payment-status").value || undefined,
    tracking_id: document.getElementById("tracking-id").value || undefined,
    courier_name: document.getElementById("courier-name").value || undefined,
    refund_status: document.getElementById("refund-status").value || undefined
  };
  // Remove undefined
  Object.keys(payload).forEach(k => payload[k] === undefined && delete payload[k]);

  try {
    await apiFetch(`/api/orders/admin/${currentOrderId}`, { method: "PUT", body: JSON.stringify(payload) });
    showToast("Order updated ✅");
    closeModal();
    loadOrders();
  } catch(e) {
    document.getElementById("modal-alert").innerHTML = `<div class="alert alert-danger">${e.message}</div>`;
  }
}

// ─── NimbusPost shipment actions ────────────────────────────────────────

async function createShipment(orderId) {
  try {
    showToast("Creating shipment with NimbusPost...");
    await apiFetch(`/api/admin/orders/${orderId}/ship`, { method: "POST" });
    showToast("Shipment created! ✅ Label ready to print.");
    loadOrders();
  } catch(e) {
    showToast(e.message || "Failed to create shipment", "error");
  }
}

async function printLabel(orderId) {
  try {
    const res = await apiFetch(`/api/admin/orders/${orderId}/label`);
    window.open(res.label_url, "_blank");
  } catch(e) {
    showToast(e.message || "Label not available", "error");
  }
}

async function trackShipment(orderId) {
  const modal = document.getElementById("track-modal");
  const content = document.getElementById("track-content");
  content.innerHTML = "Loading...";
  modal.classList.add("open");
  try {
    const t = await apiFetch(`/api/admin/orders/${orderId}/track`);
    content.innerHTML = `
      <p><strong>Status:</strong> ${t.status || 'Unknown'}</p>
      <p><strong>Location:</strong> ${t.location || '—'}</p>
      <p><strong>Last Updated:</strong> ${t.timestamp || '—'}</p>
    `;
  } catch(e) {
    content.innerHTML = `<div class="alert alert-danger">${e.message || 'Tracking unavailable'}</div>`;
  }
}

async function cancelShipment(orderId) {
  if (!confirm("Cancel this NimbusPost shipment?")) return;
  try {
    await apiFetch(`/api/admin/orders/${orderId}/cancel-shipment`, { method: "POST" });
    showToast("Shipment cancelled", "warning");
    loadOrders();
  } catch(e) {
    showToast(e.message || "Failed to cancel shipment", "error");
  }
}

// Permanent removal from the admin's own management view — distinct from
// cancellation (which just changes status and keeps the order record).
async function deleteOrder(orderId) {
  if (!confirm("Permanently delete this order? This cannot be undone.")) return;
  try {
    await apiFetch(`/api/orders/admin/${orderId}`, { method: "DELETE" });
    showToast("Order deleted", "warning");
    loadOrders();
  } catch(e) {
    showToast(e.message || "Failed to delete order", "error");
  }
}

// ─── PDF Order Summary (jsPDF, generated client-side) ───────────────────

// Loads an image URL into a base64 data URL via an off-DOM <img> + canvas.
// Resolves to null (never rejects) on any failure — a missing/CORS-blocked
// image should never stop the rest of the PDF from generating.
function loadImageAsDataURL(url, timeoutMs = 8000) {
  return new Promise((resolve) => {
    if (!url) return resolve(null);
    const img = new Image();
    img.crossOrigin = "anonymous";
    let settled = false;
    const finish = (val) => { if (!settled) { settled = true; clearTimeout(timer); resolve(val); } };
    const timer = setTimeout(() => finish(null), timeoutMs);
    img.onload = () => {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth || 400;
        canvas.height = img.naturalHeight || 400;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        finish(canvas.toDataURL("image/jpeg", 0.9));
      } catch (e) {
        finish(null); // tainted canvas (no CORS header) — skip the image
      }
    };
    img.onerror = () => finish(null);
    img.src = url;
  });
}

async function downloadOrderPDF(orderId, btnEl) {
  const originalHTML = btnEl.innerHTML;
  btnEl.disabled = true;
  btnEl.innerHTML = '<span class="btn-spinner"></span>Generating...';
  try {
    const data = await apiFetch(`/api/admin/orders/${orderId}/pdf-data`);
    await buildOrderPDF(data);
  } catch (e) {
    showToast(e.message || "Failed to generate PDF", "error");
  } finally {
    btnEl.disabled = false;
    btnEl.innerHTML = originalHTML;
  }
}

// Downloads the pre-built package PDF (product photo + NimbusPost's real
// barcode label) generated automatically after shipment — different from
// "📄 PDF" above, which renders a slip client-side on demand.
async function downloadPackagePDF(orderId, btnEl) {
  const originalHTML = btnEl.innerHTML;
  btnEl.disabled = true;
  btnEl.innerHTML = '<span class="btn-spinner"></span>Downloading...';
  try {
    const data = await apiFetch(`/api/orders/admin/${orderId}/package-pdf`);
    const byteChars = atob(data.content_base64);
    const bytes = new Uint8Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) bytes[i] = byteChars.charCodeAt(i);
    const blob = new Blob([bytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = data.filename || `order_${orderId.slice(0, 8)}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    showToast(e.message || "Failed to download package PDF", "error");
  } finally {
    btnEl.disabled = false;
    btnEl.innerHTML = originalHTML;
  }
}

async function buildOrderPDF(data) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const pageW = 210, pageH = 297, margin = 16;
  const BLACK = [10, 10, 10], GRAY = [107, 107, 107], LIGHT = [232, 232, 232], GREEN = [22, 163, 74];
  let y = margin;

  function checkPageBreak(needed) {
    if (y + needed > pageH - margin) { doc.addPage(); y = margin; }
  }

  function divider() {
    doc.setDrawColor(...LIGHT);
    doc.setLineWidth(0.3);
    doc.line(margin, y, pageW - margin, y);
    y += 8;
  }

  function sectionHeading(title) {
    checkPageBreak(14);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);
    doc.setTextColor(...BLACK);
    doc.text(title.toUpperCase(), margin, y);
    y += 3;
    doc.setDrawColor(...BLACK);
    doc.setLineWidth(0.6);
    doc.line(margin, y, margin + 26, y);
    y += 8;
  }

  const rupee = (n) => `Rs. ${Number(n || 0).toLocaleString("en-IN")}`;

  // ── SECTION 1 — ORDER HEADER ──
  doc.setFont("helvetica", "bold");
  doc.setFontSize(20);
  doc.setTextColor(...BLACK);
  doc.text("clovical", margin, y + 4);

  const orderIdShort = "#" + (data.order.id || "").slice(0, 8).toUpperCase();
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  doc.setTextColor(...GRAY);
  doc.text(orderIdShort, pageW - margin, y + 2, { align: "right" });

  y += 11;
  const orderDate = data.order.created_at
    ? new Date(data.order.created_at).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" })
    : "—";
  doc.setFontSize(9);
  doc.setTextColor(...GRAY);
  doc.text(`Order Date: ${orderDate}`, margin, y);

  const status = (data.order.status || "—").toUpperCase();
  doc.setFont("helvetica", "bold");
  doc.setFontSize(8.5);
  const badgeW = doc.getTextWidth(status) + 8;
  doc.setFillColor(...BLACK);
  doc.roundedRect(pageW - margin - badgeW, y - 4.5, badgeW, 6.5, 1.5, 1.5, "F");
  doc.setTextColor(255, 255, 255);
  doc.text(status, pageW - margin - badgeW / 2, y, { align: "center" });

  y += 8;
  divider();

  // ── SECTION 2 — PRODUCT DETAILS ──
  sectionHeading("Product Details");
  const imgSize = 28;
  let imgData = null;
  try { imgData = await loadImageAsDataURL(data.product.image); } catch (e) {}

  const textX = margin + (imgData ? imgSize + 8 : 0);
  const textW = pageW - margin * 2 - (imgData ? imgSize + 8 : 0);
  const imgTop = y;

  if (imgData) {
    try {
      doc.setDrawColor(...LIGHT);
      doc.rect(margin, y, imgSize, imgSize);
      doc.addImage(imgData, "JPEG", margin, y, imgSize, imgSize);
    } catch (e) { /* skip image if jsPDF rejects the data URL */ }
  }

  let py = y;
  doc.setFont("helvetica", "bold");
  doc.setFontSize(12);
  doc.setTextColor(...BLACK);
  const nameLines = doc.splitTextToSize(data.product.name || "—", textW);
  doc.text(nameLines, textX, py + 4);
  py += 4 + nameLines.length * 5 + 2;

  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  doc.setTextColor(...GRAY);
  doc.text(`Category: ${data.product.category || "—"}`, textX, py); py += 5;
  doc.text(`Size: ${data.product.size || "—"}    Color: ${data.product.color || "—"}`, textX, py); py += 5;
  doc.text(`Shopkeeper Code: ${data.product.shopkeeper_code || "—"}`, textX, py); py += 5;

  doc.setFont("helvetica", "bold");
  doc.setTextColor(...BLACK);
  doc.text(`Our Price: ${rupee(data.product.our_price)}`, textX, py); py += 5;
  doc.setTextColor(...GREEN);
  doc.text(`Profit: ${rupee(data.product.profit)}`, textX, py); py += 5;

  y = Math.max(imgTop + imgSize, py) + 6;
  divider();

  // ── SECTION 3 — CUSTOMER DETAILS ──
  sectionHeading("Customer Details");
  const c = data.customer;
  doc.setFont("helvetica", "bold");
  doc.setFontSize(10.5);
  doc.setTextColor(...BLACK);
  doc.text(c.name || "—", margin, y);
  y += 6;

  doc.setFont("helvetica", "normal");
  doc.setFontSize(9.5);
  doc.setTextColor(...GRAY);
  doc.text(`Phone: ${c.phone || "—"}`, margin, y);
  y += 6;

  const addrLines = doc.splitTextToSize(`Address: ${c.address || "—"}`, pageW - margin * 2);
  doc.text(addrLines, margin, y);
  y += addrLines.length * 5 + 1;

  doc.text(`City: ${c.city || "—"}     Pincode: ${c.pincode || "—"}`, margin, y);
  y += 8;
  divider();

  // ── SECTION 4 — PAYMENT DETAILS ──
  sectionHeading("Payment Details");
  const p = data.payment;
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9.5);
  doc.setTextColor(...GRAY);
  doc.text(`Payment Type: ${(p.type || "—").toUpperCase()}`, margin, y); y += 6;
  doc.text(`Payment Status: ${(p.status || "—").toUpperCase()}`, margin, y); y += 6;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(10.5);
  doc.setTextColor(...BLACK);
  doc.text(`Amount Paid: ${rupee(p.amount_paid)}`, margin, y);
  y += 8;
  divider();

  // ── SECTION 5 — SHIPPING DETAILS (if available) ──
  const s = data.shipping;
  const hasShipping = s.courier_name || s.tracking_id || s.awb || s.shipment_id;
  if (hasShipping) {
    sectionHeading("Shipping Details");
    doc.setFont("helvetica", "normal");
    doc.setFontSize(9.5);
    doc.setTextColor(...GRAY);
    if (s.courier_name) { doc.text(`Courier: ${s.courier_name}`, margin, y); y += 6; }
    if (s.tracking_id) { doc.text(`Tracking ID: ${s.tracking_id}`, margin, y); y += 6; }
    if (s.awb) { doc.text(`AWB Number: ${s.awb}`, margin, y); y += 6; }
    if (s.shipment_id) { doc.text(`NimbusPost Shipment ID: ${s.shipment_id}`, margin, y); y += 6; }
    y += 2;
    divider();
  }

  // ── SECTION 6 — PACKING CHECKLIST ──
  checkPageBreak(85);
  doc.setFillColor(...BLACK);
  doc.rect(margin, y, pageW - margin * 2, 9, "F");
  doc.setFont("helvetica", "bold");
  doc.setFontSize(11);
  doc.setTextColor(255, 255, 255);
  doc.text("PACKING CHECKLIST", margin + 4, y + 6.2);
  y += 16;

  const checklist = [
    "Correct product picked",
    `Correct size: ${data.product.size || "—"}`,
    `Correct color: ${data.product.color || "—"}`,
    "Product packed in Clovical polybag",
    "Thank you card included",
    "Label stuck on package",
    "Ready for pickup",
  ];

  doc.setFont("helvetica", "normal");
  doc.setFontSize(12);
  doc.setTextColor(...BLACK);
  checklist.forEach((item) => {
    checkPageBreak(11);
    doc.setDrawColor(...BLACK);
    doc.setLineWidth(0.5);
    doc.rect(margin, y - 4.2, 5.5, 5.5);
    doc.text(item, margin + 9, y);
    y += 11;
  });

  const safeName = (data.customer.name || "customer").replace(/[^a-zA-Z0-9]+/g, "_").replace(/^_+|_+$/g, "");
  const filename = `Order-${(data.order.id || "").slice(0, 8)}-${safeName}.pdf`;
  doc.save(filename);
}

async function logout() {
  await apiFetch("/api/auth/logout", { method: "POST" });
  window.location = "/admin/login";
}

loadOrders();
</script>
</body>
</html>
