<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopkeepers — clovical Admin</title>
  <link rel="stylesheet" href="/static/css/shared.css?v={{ ASSET_V }}">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
<div class="admin-layout">
  {% set active = 'shopkeepers' %}
  {% include 'admin/_sidebar.html' %}

  <div class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <span class="admin-topbar-title">Shopkeepers</span>
      </div>
      <button class="btn btn-primary btn-sm" onclick="openModal()">+ Add Shopkeeper</button>
    </div>

    <div class="admin-content">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Code</th><th>Shop Name</th><th>Shopkeeper</th><th>Contact</th><th>Pickup Address</th><th>Products Listed</th><th>Total Sold</th><th>Panel Login</th><th>Actions</th></tr>
          </thead>
          <tbody id="sk-body">
            <tr><td colspan="9" style="text-align:center;padding:32px;color:var(--muted)">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="sk-modal">
  <div class="modal" style="max-width:480px">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-title">Add Shopkeeper</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div id="modal-alert"></div>
    <div class="form-group">
      <label class="form-label">Shop Name *</label>
      <input class="form-control" id="shop_name" placeholder="e.g. Priya Fashion House">
    </div>
    <div class="form-group">
      <label class="form-label">Shopkeeper Name *</label>
      <input class="form-control" id="shopkeeper_name" placeholder="e.g. Priya Sharma">
    </div>
    <div class="form-group">
      <label class="form-label">WhatsApp Number *</label>
      <input class="form-control" id="contact" placeholder="91XXXXXXXXXX">
    </div>
    <div class="form-group">
      <label class="form-label">Full Address (for courier pickup)</label>
      <textarea class="form-control" id="address" rows="2" placeholder="Shop no, street, area, landmark"></textarea>
    </div>
    <div style="display:flex;gap:12px">
      <div class="form-group" style="flex:1">
        <label class="form-label">Pincode</label>
        <input class="form-control" id="pincode" maxlength="6" placeholder="6 digit pincode">
      </div>
      <div class="form-group" style="flex:1">
        <label class="form-label">City</label>
        <input class="form-control" id="city" placeholder="e.g. Bengaluru">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">State</label>
      <select class="form-control" id="state">
        <option value="">— select state —</option>
        <option>Andhra Pradesh</option>
        <option>Arunachal Pradesh</option>
        <option>Assam</option>
        <option>Bihar</option>
        <option>Chhattisgarh</option>
        <option>Goa</option>
        <option>Gujarat</option>
        <option>Haryana</option>
        <option>Himachal Pradesh</option>
        <option>Jharkhand</option>
        <option>Karnataka</option>
        <option>Kerala</option>
        <option>Madhya Pradesh</option>
        <option>Maharashtra</option>
        <option>Manipur</option>
        <option>Meghalaya</option>
        <option>Mizoram</option>
        <option>Nagaland</option>
        <option>Odisha</option>
        <option>Punjab</option>
        <option>Rajasthan</option>
        <option>Sikkim</option>
        <option>Tamil Nadu</option>
        <option>Telangana</option>
        <option>Tripura</option>
        <option>Uttar Pradesh</option>
        <option>Uttarakhand</option>
        <option>West Bengal</option>
        <option>Andaman and Nicobar Islands</option>
        <option>Chandigarh</option>
        <option>Dadra and Nagar Haveli and Daman and Diu</option>
        <option>Delhi</option>
        <option>Jammu and Kashmir</option>
        <option>Ladakh</option>
        <option>Lakshadweep</option>
        <option>Puducherry</option>
      </select>
    </div>
    <div class="form-group" id="pickup-id-row" style="display:none">
      <label class="form-label">NimbusPost Pickup ID</label>
      <input class="form-control" id="pickup-id-display" readonly style="background:#F3F0FF;color:var(--muted)">
    </div>
    <div style="display:flex;gap:12px;margin-top:8px">
      <button class="btn btn-primary btn-lg" style="flex:1" id="submit-btn" onclick="saveShopkeeper()">Save</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- Panel Login Credentials Modal -->
<div class="modal-overlay" id="cred-modal">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <h3 class="modal-title">Shopkeeper Panel Login</h3>
      <button class="modal-close" onclick="closeCredModal()">×</button>
    </div>
    <div id="cred-alert"></div>
    <div class="form-group">
      <label class="form-label">Username</label>
      <input class="form-control" id="cred-username" placeholder="e.g. priya_fashion">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-control" id="cred-password" type="password" placeholder="Min. 6 characters">
    </div>
    <div style="display:flex;gap:12px;margin-top:8px">
      <button class="btn btn-primary btn-lg" style="flex:1" id="cred-submit-btn" onclick="saveCredentials()">Save Login</button>
      <button class="btn btn-outline" onclick="closeCredModal()">Cancel</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/static/js/shared.js?v={{ ASSET_V }}"></script>
<script>
let editingId = null;

async function loadShopkeepers() {
  try {
    const sks = await apiFetch("/api/shopkeepers/admin/all");
    const body = document.getElementById("sk-body");
    if (!sks.length) {
      body.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:32px;color:var(--muted)">No shopkeepers yet.</td></tr>';
      return;
    }
    body.innerHTML = sks.map(s => `
      <tr>
        <td><strong style="color:var(--primary)">${s.code}</strong></td>
        <td><strong>${s.shop_name}</strong></td>
        <td>${s.shopkeeper_name}</td>
        <td><a href="https://wa.me/${s.contact}" target="_blank" style="color:var(--primary)">${s.contact}</a></td>
        <td style="font-size:0.8rem">
          ${s.address ? `${s.city || ''}, ${s.state || ''}` : '<span style="color:var(--muted)">Not set</span>'}
          ${s.nimbuspost_pickup_id ? `<br><span class="badge badge-success" style="margin-top:4px">Pickup Registered</span>` : (s.address ? `<br><span class="badge badge-warning" style="margin-top:4px">Not Registered</span>` : '')}
        </td>
        <td>${s.total_products}</td>
        <td>${s.total_sold}</td>
        <td>${s.has_login ? `<span class="badge badge-success">Active</span>` : `<span class="badge badge-muted">Not set</span>`}</td>
        <td>
          <button class="btn btn-outline btn-sm" onclick='openEdit(${JSON.stringify(s)})'>Edit</button>
          <button class="btn btn-outline btn-sm" onclick="openCredentials(${s.id}, ${s.has_login})">${s.has_login ? 'Reset Login' : 'Set Login'}</button>
          <button class="btn btn-danger btn-sm" onclick="deleteSK(${s.id},'${s.shop_name}')">Delete</button>
        </td>
      </tr>
    `).join("");
  } catch(e) {
    showToast("Failed to load shopkeepers", "error");
  }
}

function openModal() {
  editingId = null;
  document.getElementById("modal-title").textContent = "Add Shopkeeper";
  document.getElementById("shop_name").value = "";
  document.getElementById("shopkeeper_name").value = "";
  document.getElementById("contact").value = "";
  document.getElementById("address").value = "";
  document.getElementById("pincode").value = "";
  document.getElementById("city").value = "";
  document.getElementById("state").value = "";
  document.getElementById("pickup-id-row").style.display = "none";
  document.getElementById("modal-alert").innerHTML = "";
  document.getElementById("sk-modal").classList.add("open");
}

function openEdit(s) {
  editingId = s.id;
  document.getElementById("modal-title").textContent = "Edit Shopkeeper";
  document.getElementById("shop_name").value = s.shop_name;
  document.getElementById("shopkeeper_name").value = s.shopkeeper_name;
  document.getElementById("contact").value = s.contact;
  document.getElementById("address").value = s.address || "";
  document.getElementById("pincode").value = s.pincode || "";
  document.getElementById("city").value = s.city || "";
  document.getElementById("state").value = s.state || "";
  if (s.nimbuspost_pickup_id) {
    document.getElementById("pickup-id-row").style.display = "block";
    document.getElementById("pickup-id-display").value = s.nimbuspost_pickup_id;
  } else {
    document.getElementById("pickup-id-row").style.display = "none";
  }
  document.getElementById("modal-alert").innerHTML = "";
  document.getElementById("sk-modal").classList.add("open");
}

function closeModal() { document.getElementById("sk-modal").classList.remove("open"); }

async function saveShopkeeper() {
  const btn = document.getElementById("submit-btn");
  btn.disabled = true; btn.textContent = "Saving...";
  const data = {
    shop_name: document.getElementById("shop_name").value.trim(),
    shopkeeper_name: document.getElementById("shopkeeper_name").value.trim(),
    contact: document.getElementById("contact").value.trim(),
    address: document.getElementById("address").value.trim() || null,
    pincode: document.getElementById("pincode").value.trim() || null,
    city: document.getElementById("city").value.trim() || null,
    state: document.getElementById("state").value || null
  };
  if (!data.shop_name || !data.shopkeeper_name || !data.contact) {
    document.getElementById("modal-alert").innerHTML = '<div class="alert alert-danger">Shop name, shopkeeper name and contact are required</div>';
    btn.disabled = false; btn.textContent = "Save";
    return;
  }
  try {
    const url = editingId ? `/api/shopkeepers/admin/${editingId}` : "/api/shopkeepers/admin/add";
    const method = editingId ? "PUT" : "POST";
    const result = await apiFetch(url, { method, body: JSON.stringify(data) });
    if (data.address && !result.nimbuspost_pickup_id) {
      showToast(editingId ? "Updated! ⚠️ NimbusPost pickup registration failed — check address details" : "Shopkeeper added! ⚠️ NimbusPost pickup registration failed", "warning");
    } else {
      showToast(editingId ? "Updated! ✅" : "Shopkeeper added! ✅");
    }
    closeModal();
    loadShopkeepers();
  } catch(e) {
    document.getElementById("modal-alert").innerHTML = `<div class="alert alert-danger">${e.message}</div>`;
  }
  btn.disabled = false; btn.textContent = "Save";
}

async function deleteSK(id, name) {
  if (!confirm(`Delete shopkeeper "${name}"?`)) return;
  try {
    await apiFetch(`/api/shopkeepers/admin/${id}`, { method: "DELETE" });
    showToast("Deleted", "warning");
    loadShopkeepers();
  } catch(e) { showToast(e.message, "error"); }
}

async function logout() {
  await apiFetch("/api/auth/logout", { method: "POST" });
  window.location = "/admin/login";
}

let credSkId = null;

function openCredentials(skId, hasLogin) {
  credSkId = skId;
  document.getElementById('cred-username').value = '';
  document.getElementById('cred-password').value = '';
  document.getElementById('cred-alert').innerHTML = hasLogin
    ? '<div class="alert alert-warning">This resets their existing login — the old username/password will stop working.</div>' : '';
  document.getElementById('cred-modal').classList.add('open');
}

function closeCredModal() { document.getElementById('cred-modal').classList.remove('open'); credSkId = null; }

async function saveCredentials() {
  const username = document.getElementById('cred-username').value.trim();
  const password = document.getElementById('cred-password').value;
  if (!username || username.length < 3) {
    document.getElementById('cred-alert').innerHTML = '<div class="alert alert-danger">Username must be at least 3 characters</div>';
    return;
  }
  if (!password || password.length < 6) {
    document.getElementById('cred-alert').innerHTML = '<div class="alert alert-danger">Password must be at least 6 characters</div>';
    return;
  }
  const btn = document.getElementById('cred-submit-btn');
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    await apiFetch(`/api/shopkeepers/admin/${credSkId}/credentials`, {
      method: 'PUT',
      body: JSON.stringify({ username, password })
    });
    showToast('Panel login saved ✅');
    closeCredModal();
    loadShopkeepers();
  } catch(e) {
    document.getElementById('cred-alert').innerHTML = `<div class="alert alert-danger">⚠️ ${e.message}</div>`;
  }
  btn.disabled = false; btn.textContent = 'Save Login';
}

loadShopkeepers();
</script>
</body>
</html>
