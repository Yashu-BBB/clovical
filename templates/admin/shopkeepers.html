<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/images/android-chrome-512x512.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopkeepers — clovical Admin</title>
  <link rel="stylesheet" href="/static/css/shared.css?v={{ ASSET_V }}">
  <link rel="stylesheet" href="/static/css/admin.css">
  <style>
    .login-status-cell { display:flex; align-items:center; gap:6px; }

    @media (max-width: 760px) {
      /* Shop name cell reads better full-width without a redundant
         label crowding it, matching the pattern used on other admin
         tables (products.html Image cell, categories.html Icon cell) */
      .table-card td[data-label="Shop"] { justify-content: flex-start; }
      /* Actions: full-width stacked, comfortably tappable — this page has
         more actions per row (Edit / Set Login / Revoke / Delete) than
         most, so give them room instead of squeezing side by side */
      .table-card td.td-actions .btn { min-width: 0; flex: 1 1 100%; }
    }
  </style>
</head>
<body>
<div class="admin-layout">
  {% set active = 'shopkeepers' %}
  {% include 'admin/_sidebar.html' %}

  <div class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <span class="admin-topbar-title">Shopkeepers</span>
      </div>
      <button class="btn btn-primary btn-sm" onclick="openModal()">+ Add Shopkeeper</button>
    </div>

    <div class="admin-content">
      <div class="table-wrap table-card-wrap">
        <table class="table-card">
          <thead>
            <tr><th>Code</th><th>Shop</th><th>Products</th><th>Sold</th><th>Panel Login</th><th>Actions</th></tr>
          </thead>
          <tbody id="sk-body">
            <tr><td colspan="6" style="text-align:center;padding:32px;color:var(--muted)">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Shopkeeper Modal -->
<div class="modal-overlay" id="sk-modal">
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-title">Add Shopkeeper</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div id="modal-alert"></div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Shop Name *</label>
        <input class="form-control" id="sk-shop-name" maxlength="200" placeholder="e.g. Meena Fashions">
      </div>
      <div class="form-group">
        <label class="form-label">Shopkeeper Name *</label>
        <input class="form-control" id="sk-shopkeeper-name" maxlength="200" placeholder="e.g. Meena Kumari">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">WhatsApp / Contact Number *</label>
      <input class="form-control" id="sk-contact" maxlength="15" placeholder="e.g. 9876543210">
    </div>

    <div class="form-group">
      <label class="form-label">Address <span style="color:var(--muted);font-weight:400;font-size:0.82rem">— required for courier pickup registration</span></label>
      <input class="form-control" id="sk-address" maxlength="500" placeholder="Full street address">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">City</label>
        <input class="form-control" id="sk-city" maxlength="100" placeholder="e.g. Davanagere">
      </div>
      <div class="form-group">
        <label class="form-label">State</label>
        <input class="form-control" id="sk-state" maxlength="100" placeholder="e.g. Karnataka">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Pincode</label>
      <input class="form-control" id="sk-pincode" maxlength="6" placeholder="6-digit pincode">
    </div>

    <div style="display:flex;gap:12px;margin-top:8px">
      <button class="btn btn-primary btn-lg" style="flex:1" id="submit-btn" onclick="saveShopkeeper()">Save</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- Set/Reset Panel Login Credentials Modal -->
<div class="modal-overlay" id="creds-modal">
  <div class="modal" style="max-width:440px">
    <div class="modal-header">
      <h3 class="modal-title" id="creds-modal-title">Set Panel Login</h3>
      <button class="modal-close" onclick="closeCredsModal()">×</button>
    </div>
    <div id="creds-modal-alert"></div>
    <div class="form-group">
      <label class="form-label">Username *</label>
      <input class="form-control" id="creds-username" maxlength="50" placeholder="e.g. meena_fashions">
    </div>
    <div class="form-group">
      <label class="form-label">Password *</label>
      <input class="form-control" id="creds-password" type="text" maxlength="100" placeholder="At least 6 characters">
      <div style="font-size:0.8rem;color:var(--muted);margin-top:4px">Shown in plain text so you can hand it to the shopkeeper directly.</div>
    </div>
    <div style="display:flex;gap:12px;margin-top:8px">
      <button class="btn btn-primary btn-lg" style="flex:1" id="creds-submit-btn" onclick="saveCredentials()">Save Login</button>
      <button class="btn btn-outline" onclick="closeCredsModal()">Cancel</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/static/js/shared.js?v={{ ASSET_V }}"></script>
<script>
let editingId = null;
let credsSkId = null;
let allShopkeepers = [];

async function loadShopkeepers() {
  const body = document.getElementById('sk-body');
  try {
    allShopkeepers = await apiFetch('/api/shopkeepers/admin/all');
    renderTable();
  } catch (e) {
    body.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--muted)">${e.message || 'Failed to load shopkeepers'}</td></tr>`;
  }
}

function renderTable() {
  const body = document.getElementById('sk-body');
  if (!allShopkeepers.length) {
    body.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--muted)">No shopkeepers yet</td></tr>';
    return;
  }
  body.innerHTML = allShopkeepers.map(sk => `
    <tr>
      <td class="td-plain" data-label="Code"><strong>${escapeHtml(sk.code)}</strong></td>
      <td data-label="Shop">
        <div>
          <div><strong>${escapeHtml(sk.shop_name)}</strong></div>
          <div style="font-size:0.78rem;color:var(--muted)">${escapeHtml(sk.shopkeeper_name)} · ${escapeHtml(sk.contact || '—')}</div>
        </div>
      </td>
      <td data-label="Products">${sk.total_products}</td>
      <td data-label="Sold">${sk.total_sold}</td>
      <td data-label="Panel Login">
        <span class="login-status-cell">
          <span class="badge badge-${sk.has_login ? 'success' : 'muted'}">${sk.has_login ? 'Active' : 'Not set'}</span>
        </span>
      </td>
      <td class="td-actions" data-label="Actions">
        <button class="btn btn-outline btn-sm" onclick='openEdit(${JSON.stringify(sk)})'>Edit</button>
        <button class="btn btn-outline btn-sm" onclick="openCredsModal(${sk.id}, '${escapeHtml(sk.shop_name)}', ${sk.has_login})">${sk.has_login ? 'Reset Login' : 'Set Login'}</button>
        ${sk.has_login ? `<button class="btn btn-outline btn-sm" onclick="revokeCredentials(${sk.id}, '${escapeHtml(sk.shop_name)}')">Revoke Login</button>` : ''}
        <button class="btn btn-danger btn-sm" onclick="deleteShopkeeper(${sk.id}, '${escapeHtml(sk.shop_name)}')">Delete</button>
      </td>
    </tr>
  `).join('');
}

function openModal() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Add Shopkeeper';
  document.getElementById('sk-shop-name').value = '';
  document.getElementById('sk-shopkeeper-name').value = '';
  document.getElementById('sk-contact').value = '';
  document.getElementById('sk-address').value = '';
  document.getElementById('sk-city').value = '';
  document.getElementById('sk-state').value = '';
  document.getElementById('sk-pincode').value = '';
  document.getElementById('modal-alert').innerHTML = '';
  document.getElementById('sk-modal').classList.add('open');
}

function openEdit(sk) {
  editingId = sk.id;
  document.getElementById('modal-title').textContent = 'Edit Shopkeeper';
  document.getElementById('sk-shop-name').value = sk.shop_name || '';
  document.getElementById('sk-shopkeeper-name').value = sk.shopkeeper_name || '';
  document.getElementById('sk-contact').value = sk.contact || '';
  document.getElementById('sk-address').value = sk.address || '';
  document.getElementById('sk-city').value = sk.city || '';
  document.getElementById('sk-state').value = sk.state || '';
  document.getElementById('sk-pincode').value = sk.pincode || '';
  document.getElementById('modal-alert').innerHTML = '';
  document.getElementById('sk-modal').classList.add('open');
}

function closeModal() { document.getElementById('sk-modal').classList.remove('open'); }

async function saveShopkeeper() {
  const btn = document.getElementById('submit-btn');
  const data = {
    shop_name: document.getElementById('sk-shop-name').value.trim(),
    shopkeeper_name: document.getElementById('sk-shopkeeper-name').value.trim(),
    contact: document.getElementById('sk-contact').value.trim(),
    address: document.getElementById('sk-address').value.trim() || null,
    city: document.getElementById('sk-city').value.trim() || null,
    state: document.getElementById('sk-state').value.trim() || null,
    pincode: document.getElementById('sk-pincode').value.trim() || null,
  };

  if (!data.shop_name || !data.shopkeeper_name || !data.contact) {
    document.getElementById('modal-alert').innerHTML = '<div class="alert alert-danger">Shop name, shopkeeper name and contact number are required</div>';
    return;
  }
  if (data.pincode && data.pincode.length !== 6) {
    document.getElementById('modal-alert').innerHTML = '<div class="alert alert-danger">Pincode must be exactly 6 digits</div>';
    return;
  }

  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    const url = editingId ? `/api/shopkeepers/admin/${editingId}` : '/api/shopkeepers/admin/add';
    const method = editingId ? 'PUT' : 'POST';
    await apiFetch(url, { method, body: JSON.stringify(data) });
    showToast(editingId ? 'Shopkeeper updated! ✅' : 'Shopkeeper added! ✅');
    closeModal();
    loadShopkeepers();
  } catch (e) {
    document.getElementById('modal-alert').innerHTML = `<div class="alert alert-danger">${e.message || 'Failed to save shopkeeper'}</div>`;
  }
  btn.disabled = false; btn.textContent = 'Save';
}

async function deleteShopkeeper(id, name) {
  if (!confirm(`Delete shopkeeper "${name}"? This cannot be undone.`)) return;
  try {
    await apiFetch(`/api/shopkeepers/admin/${id}`, { method: 'DELETE' });
    showToast('Shopkeeper deleted', 'warning');
    loadShopkeepers();
  } catch (e) {
    showToast(e.message || 'Failed to delete shopkeeper', 'error');
  }
}

// ─── Panel Login Credentials ────────────────────────────────────────────
function openCredsModal(id, shopName, hasLogin) {
  credsSkId = id;
  document.getElementById('creds-modal-title').textContent = hasLogin ? `Reset Login — ${shopName}` : `Set Login — ${shopName}`;
  document.getElementById('creds-username').value = '';
  document.getElementById('creds-password').value = '';
  document.getElementById('creds-modal-alert').innerHTML = '';
  document.getElementById('creds-modal').classList.add('open');
}

function closeCredsModal() { document.getElementById('creds-modal').classList.remove('open'); }

async function saveCredentials() {
  const btn = document.getElementById('creds-submit-btn');
  const username = document.getElementById('creds-username').value.trim();
  const password = document.getElementById('creds-password').value;

  if (username.length < 3) {
    document.getElementById('creds-modal-alert').innerHTML = '<div class="alert alert-danger">Username must be at least 3 characters</div>';
    return;
  }
  if (password.length < 6) {
    document.getElementById('creds-modal-alert').innerHTML = '<div class="alert alert-danger">Password must be at least 6 characters</div>';
    return;
  }

  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    await apiFetch(`/api/shopkeepers/admin/${credsSkId}/credentials`, {
      method: 'PUT',
      body: JSON.stringify({ username, password }),
    });
    showToast('Panel login saved! ✅');
    closeCredsModal();
    loadShopkeepers();
  } catch (e) {
    document.getElementById('creds-modal-alert').innerHTML = `<div class="alert alert-danger">${e.message || 'Failed to save login'}</div>`;
  }
  btn.disabled = false; btn.textContent = 'Save Login';
}

async function revokeCredentials(id, shopName) {
  if (!confirm(`Revoke panel login for "${shopName}"? They will no longer be able to sign in until you set a new login.`)) return;
  try {
    await apiFetch(`/api/shopkeepers/admin/${id}/credentials`, { method: 'DELETE' });
    showToast('Panel login revoked', 'warning');
    loadShopkeepers();
  } catch (e) {
    showToast(e.message || 'Failed to revoke login', 'error');
  }
}

async function logout() {
  await apiFetch('/api/auth/logout', { method: 'POST' });
  window.location = '/admin/login';
}

loadShopkeepers();
</script>
</body>
</html>
